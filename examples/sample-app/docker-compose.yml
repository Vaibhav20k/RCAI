version: "3.8"

services:
  web:
    image: nginx:alpine
    container_name: sample-web
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    image: python:3.11-slim
    container_name: sample-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://sample:password@postgres:5432/sample_db
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: sample-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sample_db
      - POSTGRES_USER=sample
      - POSTGRES_PASSWORD=password
