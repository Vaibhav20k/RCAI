# ==============================================================================
# RCAI (Root Cause AI) — Drop-In Auto-Discovery Snippet
# ==============================================================================
# This snippet enables zero-config deployment of RCAI into ANY Docker Compose
# project. RCAI auto-discovers your services, maps their topology, probes for
# Prometheus metrics endpoints, and runs autonomous incident diagnosis.
#
# USAGE OPTIONS:
#
# Option A — Multi-file Compose (Recommended, leaves your compose file untouched):
#   docker compose -f docker-compose.yml -f docker-compose.snippet.yml up -d
#
# Option B — Append to your existing docker-compose.yml:
#   cat docker-compose.snippet.yml >> docker-compose.yml
#   docker compose up -d
#
# Option C — Interactive 1-click installer:
#   ./install.sh
# ==============================================================================

version: "3.8"

services:
  rcai:
    # Image name (defaults to local tag 'rcai-agent:latest' or published registry image)
    image: ${RCAI_IMAGE:-rcai-agent:latest}
    build:
      # Defaults to current directory or RCAI clone directory when invoked externally
      context: ${RCAI_DIR:-.}
      dockerfile: Dockerfile
    container_name: rcai-engine
    restart: unless-stopped
    ports:
      - "${RCAI_PORT:-8000}:8000"
    environment:
      # Enable dynamic Docker daemon auto-discovery
      - RCAI_DISCOVERY_MODE=docker
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      # Zero-config default: rule_based requires NO API keys and NO local Ollama daemon
      - LLM_BACKEND=${LLM_BACKEND:-rule_based}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://rcai-prometheus:9090}
      - PORT=8000

    volumes:
      # ========================================================================
      # MANDATORY READ-ONLY DOCKER SOCKET MOUNT (:ro)
      # ========================================================================
      # RCAI requires access to the Docker socket exclusively to:
      #   1. Query 'GET /containers/json' to discover running services.
      #   2. Inspect container network IPs and published ports.
      #   3. Parse compose labels ('com.docker.compose.service').
      #
      # SECURITY GUARANTEE:
      # The ':ro' (read-only) flag is MANDATORY. It cryptographically and
      # structurally prevents RCAI from creating, modifying, starting, stopping,
      # executing into, or deleting any containers on the host Docker daemon.
      # ========================================================================
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - rcai_prometheus_data:/etc/rcai/prometheus
    networks:
      - default

  # ----------------------------------------------------------------------------
  # RCAI Bundled Prometheus (Optional Telemetry Collector)
  # ----------------------------------------------------------------------------
  # If you do not already run Prometheus, this service automatically scrapes
  # all discovered services with '/metrics' endpoints using the scrape configuration
  # auto-generated by RCAI discovery.
  # ----------------------------------------------------------------------------
  rcai-prometheus:
    image: prom/prometheus:v2.45.0
    container_name: rcai-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - rcai_prometheus_data:/etc/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - default

volumes:
  rcai_prometheus_data:
