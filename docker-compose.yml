version: "3.8"

services:
  api-gateway:
    build:
      context: .
      dockerfile: simulator/services/Dockerfile
    container_name: rcai-api-gateway
    environment:
      - SERVICE_NAME=api-gateway
      - SERVICE_PORT=8000
      - ORDER_SERVICE_URL=http://order-service:8001
      - PAYMENT_SERVICE_URL=http://payment-service:8002
    ports:
      - "8000:8000"
    depends_on:
      - order-service
      - payment-service

  order-service:
    build:
      context: .
      dockerfile: simulator/services/Dockerfile
    container_name: rcai-order-service
    environment:
      - SERVICE_NAME=order-service
      - SERVICE_PORT=8001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    ports:
      - "8001:8001"
    depends_on:
      - postgres

  payment-service:
    build:
      context: .
      dockerfile: simulator/services/Dockerfile
    container_name: rcai-payment-service
    environment:
      - SERVICE_NAME=payment-service
      - SERVICE_PORT=8002
      - DEPENDENCY_SERVICE_URL=http://dependency-service:8003
      - REDIS_HOST=redis
    ports:
      - "8002:8002"
    depends_on:
      - dependency-service
      - redis

  dependency-service:
    build:
      context: .
      dockerfile: simulator/services/Dockerfile
    container_name: rcai-dependency-service
    environment:
      - SERVICE_NAME=dependency-service
      - SERVICE_PORT=8003
    ports:
      - "8003:8003"

  postgres:
    image: postgres:15-alpine
    container_name: rcai-postgres
    environment:
      - POSTGRES_DB=rcai_db
      - POSTGRES_USER=rcai_user
      - POSTGRES_PASSWORD=rcai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rcai-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: rcai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres_data:
